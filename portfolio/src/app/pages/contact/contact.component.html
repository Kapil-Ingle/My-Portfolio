<section class="content-section d-flex flex-column">

  <!-- Page Header -->
  <div class="page-header d-flex align-items-center mt-5">
    <h2 class="section-title mx-auto">Contact</h2>
  </div>

  <!-- Main Content -->
  <div class="row justify-content-evenly mt-4 mx-0">

    <!-- LEFT COLUMN : CONTACT DETAILS -->
    <div class="col-md-4 mb-4">
      <h4 class="mb-4">Get in Touch</h4>

      <div class="contact-item mb-3">
        <i class="bi bi-telephone-fill"></i>
        <span>+91 9834959267</span>
      </div>

      <div class="contact-item mb-3">
        <i class="bi bi-envelope-fill"></i>
        <span>codingkapil&#64;gmail.com</span>
      </div>

      <div class="contact-item">
        <i class="bi bi-geo-alt-fill"></i>
        <span>
          Powai, Mumbai, Maharashtra<br />
          India.
        </span>
      </div>
    </div>

    <!-- RIGHT COLUMN : SEND EMAIL -->
    <div class="col-md-4 mb-4">
      <h4 class="mb-4">Write to Me</h4>

      <form>
        <div class="mb-3">
          <label class="form-label">Your Name</label>
          <input type="text" class="form-control" placeholder="Enter your name">
        </div>

        <div class="mb-3">
          <label class="form-label">Your Email</label>
          <input type="email" class="form-control" placeholder="Enter your email">
        </div>

        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="4" placeholder="Write your message"></textarea>
        </div>

        <button type="submit" class="btn send-btn w-100">
          Send Email
        </button>
      </form>
    </div>

  </div>

</section>
