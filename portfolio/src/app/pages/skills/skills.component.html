<section class="content-section d-flex flex-column">

  <!-- Page Header -->
  <div class="page-header d-flex align-items-center mt-3    ">
    <h2 class="section-title mx-auto">Skills</h2>
  </div>

  <section class="skills-section container py-3">
    <div class="row justify-content-evenly">

      <!-- LEFT COLUMN -->
      <div class="col-lg-5 col-md-12">

        <!-- FRONTEND -->
        <h3 class="skill-group-title">Frontend Skills</h3>
        <div class="skills-grid">
          @for(skill of frontendSkills; track skill){
          <div class="skill-card border border-secondary" [appTooltip]="skill.tooltip">
            <i class="text-secondary" [class]="skill.iconClass"></i>
          </div>
          }
        </div>

        <!-- BACKEND -->
        <h3 class="skill-group-title mt-3">Backend Skills</h3>
        <div class="skills-grid">
          @for(skill of backendSkills; track skill){
          <div class="skill-card border border-secondary" [appTooltip]="skill.tooltip">
            <i class="text-secondary" [class]="skill.iconClass"></i>
          </div>
          }
        </div>

        <!-- TOOLS -->
        <h3 class="skill-group-title mt-3">Tools</h3>
        <div class="skills-grid">
          @for(skill of tools; track skill){
          <div class="skill-card border border-secondary" [appTooltip]="skill.tooltip">
            <i class="text-secondary" [class]="skill.iconClass"></i>
          </div>
          }
        </div>

      </div>

      <!-- RIGHT COLUMN IMAGE -->
      <div class="col-lg-6 col-md-12 align-self-center justify-content-center text-center mt-5 mt-lg-0">
        <img src="assets/laptop.jpg" alt="Laptop with code" class="img-fluid laptop-image" />
      </div>

    </div>
  </section>
  
</section>
